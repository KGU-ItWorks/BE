spring:
  # --- DB (로컬 PostgreSQL) ---
  datasource:
    url: jdbc:postgresql://localhost:5432/streamly
    username: streamly
    password: streamly123
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # --- Redis (로컬, 비밀번호 없음) ---
  data:
    redis:
      host: localhost
      port: 6379

  # --- RabbitMQ (로컬) ---
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123

# --- JWT (로컬 테스트용 고정값) ---
jwt:
  secret: ${JWT_SECRET}

# --- Cookie (로컬은 http) ---
cookie:
  secure: false

# --- Frontend URL ---
frontend:
  url: http://localhost:3000

# --- 영상 처리 경로 ---
video:
  upload:
    directory: C:/ItWorks/uploads
  encoded:
    directory: C:/ItWorks/encoded

# --- AWS S3 → MinIO로 대체 ---
aws:
  access-key: minioadmin
  secret-key: minioadmin
  region: ap-northeast-2
  s3:
    bucket-name: streamly-local
  cloudfront:
    domain:
  endpoint: http://localhost:9000

# --- Logging (로컬은 상세하게) ---
logging:
  level:
    com.streamly.streamly: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
