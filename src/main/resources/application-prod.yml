# application-prod.yml
# 프로덕션 환경 전용 설정 (공통값은 application.yml 참고)

spring:
  # --- DB (prod: RDS 연결 + 커넥션풀 튜닝) ---
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:streamly}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

  # --- OAuth2 (prod: redirect-uri 고정) ---
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: "https://streamlyai.store/login/oauth2/code/google"
          kakao:
            redirect-uri: "https://streamlyai.store/login/oauth2/code/kakao"

  # --- Redis (prod: 비밀번호 사용) ---
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms

  # --- RabbitMQ (prod) ---
  rabbitmq:
    host: ${RABBITMQ_HOST}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1

# --- Cookie (prod: https) ---
cookie:
  secure: true

# --- Frontend URL ---
frontend:
  url: https://streamlyai.store

# --- Server 튜닝 ---
server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json
  forward-headers-strategy: framework
  tomcat:
    max-connections: 10000
    threads:
      max: 200
      min-spare: 10

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always

# --- 영상 처리 경로 (prod: 컨테이너 내부 경로) ---
video:
  upload:
    directory: /app/uploads
  encoded:
    directory: /app/encoded

# --- AWS (prod) ---
aws:
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  region: ap-northeast-2
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}
  cloudfront:
    domain: ${AWS_CLOUDFRONT_DOMAIN}

# --- Logging (prod: 파일 출력) ---
logging:
  level:
    root: INFO
    com.streamly.streamly: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: /app/logs/streamly.log
    max-size: 10MB
    max-history: 30