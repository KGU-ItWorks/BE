version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: streamly-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: streamly
      POSTGRES_USER: streamly
      POSTGRES_PASSWORD: streamly123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - streamly-local

  redis:
    image: redis:7-alpine
    container_name: streamly-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - streamly-local

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: streamly-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # 관리 UI: http://localhost:15672 (admin/admin123)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - streamly-local

  minio:
    image: minio/minio:latest
    container_name: streamly-minio
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # 관리 UI: http://localhost:9001 (minioadmin/minioadmin)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - streamly-local

  # MinIO 버킷 자동 생성
  minio-init:
    image: minio/mc:latest
    container_name: streamly-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/streamly-local;
      mc anonymous set download local/streamly-local;
      echo 'MinIO bucket ready';
      "
    networks:
      - streamly-local

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:

networks:
  streamly-local:
    driver: bridge